plugins { id 'com.android.application' }
android {
 namespace 'com.wordville.app'
 compileSdk 35
 defaultConfig { applicationId 'com.wordville.app.village.vocabulary.safeinstall'; minSdk 26; targetSdk 35; versionCode 8; versionName '2.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 signingConfigs { debug { storeFile file(System.getenv('WORDVILLE_KEYSTORE') ?: "${System.getProperty('user.home')}/.wordville/wordville-debug.keystore"); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'junit:junit:4.13.2'
}
