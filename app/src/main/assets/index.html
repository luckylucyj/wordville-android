<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Wordville · 영어가 쌓이는 마을</title><link rel="stylesheet" href="style.css"><script defer src="engine.js"></script><script defer src="app.js"></script></head><body>
<header><span class="brand">▦ WORDVILLE</span><span id="balance">0 XP · 0 코인</span></header>
<main><section class="intro"><small>나의 작은 영어 마을</small><h1>오늘도 한 단어,<br>조금 더 넓어진 세상.</h1><p>단어를 배우고 주민과 대화하며 복습해요.</p><div class="town" aria-label="픽셀 마을"><span class="cloud">☁</span><span class="house house1">▥</span><span class="house house2">▥</span><span class="tree">♠</span><span class="resident">♟</span><span class="path"></span></div></section>
<nav aria-label="학습 메뉴"><button data-tab="learn" aria-selected="true">단어 학습</button><button data-tab="review">복습</button><button data-tab="lab">조합실</button><button data-tab="book">도감</button></nav>
<section id="learn"><div class="section-title"><h2>나의 단어장</h2><span>기초 예시 20개</span></div><label>단어 또는 한국어 뜻 검색<input id="search" type="search" placeholder="reservation 또는 예약"></label><div id="words" class="words"></div></section>
<section id="review" hidden><h2>오늘의 복습</h2><p id="due"></p><button id="start-review" class="primary">복습 시작</button><div id="review-card" class="card" hidden><h3 id="question"></h3><form id="answer-form"><label>한국어 뜻<input id="answer" autocomplete="off" required></label><button class="primary">정답 확인</button></form><p id="answer-result" role="status"></p><button id="next" hidden>다음 단어</button></div></section>
<section id="lab" hidden><h2>자유 개념 조합실</h2><p>단어 2개를 연결하고 직접 개념 이름을 지어 보세요.</p><p class="muted">주민 설명은 준비된 예문과 규칙으로 구성됩니다.</p><form id="combine-form" class="card"><label>첫 번째 단어<select id="word-a"></select></label><label>두 번째 단어<select id="word-b"></select></label><p id="connection"></p><label>나의 개념 이름<input id="concept-name" maxlength="60" required placeholder="예: 호텔 예약 확인"></label><button type="button" id="random">무작위 선택</button><button class="primary">도감에 저장 · +15 XP</button></form></section>
<section id="book" hidden><h2>나의 개념 도감</h2><div id="concepts"></div></section>
<p id="notice" role="status"></p><footer>학습 기록과 이미지는 이 기기에 저장됩니다.<br>로그인·기기 간 동기화는 아직 제공하지 않습니다.</footer></main>
<dialog id="word-dialog"><button id="close-dialog" class="close" aria-label="닫기">×</button><small>WORD CARD</small><h2 id="detail-word"></h2><button id="reveal">뜻 보기</button><p id="detail-meaning" hidden></p><p id="detail-example" class="example"></p><p id="detail-translation"></p><div class="roleplay"><b id="role"></b><p id="dialogue"></p></div><label>기억용 이미지 선택 · 최대 5MB<input id="image-input" type="file" accept="image/*"></label><img id="memory-image" alt="이 단어에 연결한 기억용 이미지" hidden><button id="remove-image" hidden>이미지 삭제</button><button id="learned" class="primary">학습 완료 · 복습 예약</button><p id="detail-status" role="status"></p></dialog>
</body></html>
