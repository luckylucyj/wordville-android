name: Build wordville Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test learning logic
        run: npm test
      - name: Test mobile web interactions
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          python3 -m http.server 4173 --directory app/src/main/assets &
          CHROME_PATH="$(command -v google-chrome)" node tests/browser.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint Android app
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk wordville-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wordville-android-apk
          path: wordville-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
