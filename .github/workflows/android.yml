name: Build wordville Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: wordville-signing-${{ github.repository }}-v1.7-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDVILLE_KEYSTORE: ${{ github.workspace }}/.signing/wordville-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci
      - name: Bundle cloud client
        run: npm run build:web
      - name: Test learning logic
        run: npm test
      - name: Test mobile web interactions
        run: |
          python3 -m http.server 4173 --directory app/src/main/assets &
          CHROME_PATH="$(command -v google-chrome)" node tests/browser.cjs
          CHROME_PATH="$(command -v google-chrome)" node tests/notes-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordville-portraits-browser-qa
          path: wordville-portraits-browser.png
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Wordville signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORDVILLE_KEYSTORE }}
          key: wordville-safeinstall-signing-v1
      - name: Prepare persistent signing key
        run: |
          mkdir -p "$(dirname "$WORDVILLE_KEYSTORE")"
          if [ ! -f "$WORDVILLE_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$WORDVILLE_KEYSTORE" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Wordville Reviewed, O=Wordville, C=KR"
          fi
      - name: Reject signing-key changes that would break APK upgrades
        run: |
          ACTUAL="$(keytool -exportcert -alias androiddebugkey -keystore "$WORDVILLE_KEYSTORE" -storepass android | sha256sum | cut -d' ' -f1)"
          EXPECTED="b6b22288413579b584c10f2c6da61548327aa7747e8d1e96e49a52286adf4470"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed. Stop to avoid publishing an un-installable update."
            exit 1
          fi
      - name: Cache signing key before any later tests can fail
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORDVILLE_KEYSTORE }}
          key: wordville-safeinstall-signing-v1
      - name: Encrypt signing-key recovery backup
        run: |
          mkdir -p "$RUNNER_TEMP/wordville-signing-backup"
          openssl rand -hex 32 > "$RUNNER_TEMP/signing-backup-password"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$WORDVILLE_KEYSTORE" -out "$RUNNER_TEMP/wordville-signing-backup/keystore.enc" -pass file:"$RUNNER_TEMP/signing-backup-password"
          openssl pkeyutl -encrypt -pubin -inkey scripts/build-signing-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/signing-backup-password" -out "$RUNNER_TEMP/wordville-signing-backup/password.enc"
          rm "$RUNNER_TEMP/signing-backup-password"
      - uses: actions/upload-artifact@v4
        with:
          name: wordville-signing-recovery-encrypted
          path: ${{ runner.temp }}/wordville-signing-backup/
          retention-days: 7
          if-no-files-found: error
      - name: Build and lint Android app
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify APK signature
        run: '$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk wordville-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wordville-android-apk
          path: wordville-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
  android-device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke-apks
          path: smoke
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install smoke/debug/app-debug.apk
            adb install smoke/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.wordville.app.village.vocabulary.safeinstall.test/androidx.test.runner.AndroidJUnitRunner > android-test-result.txt
            cat android-test-result.txt
            grep -Eq 'OK \([0-9]+ tests?\)' android-test-result.txt
            adb pull /sdcard/Android/data/com.wordville.app.village.vocabulary.safeinstall/files/wordville-map-emulator.png wordville-map-emulator.png
            test -s wordville-map-emulator.png
            test "$(stat -c%s wordville-map-emulator.png)" -gt 120000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordville-map-visual-qa
          path: wordville-map-emulator.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-result
          path: android-test-result.txt
          if-no-files-found: ignore
  publish-apk:
    name: Publish signed install-fix APK to GitHub Releases
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wordville-android-apk
          path: release
      - name: Prepare standalone APK file
        run: |
          test -s release/wordville-debug.apk
          cp release/wordville-debug.apk release/Wordville_HiRes_Residents_Stairs_v2.0.0.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0-hires-residents-stairs"
          ASSET="release/Wordville_HiRes_Residents_Stairs_v2.0.0.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Wordville v2.0.0 - Original HiRes Portraits and Fountain-Safe Walking" \
              --notes "Wordville v2.0.0. User-supplied 1536x1152 portraits included bit-identically; 12 residents have lossless transparency-extracted original two-pose sprites (1312x756 atlas), four-phase sway/bob walking and staircase movement. The navigation graph excludes fountain water and stone, plus connected entrance stairs. Existing study data, storage and package/signature are preserved. Test on your Galaxy to validate display quality and all touch gestures." \
              --prerelease
          fi
